name: Fyrion CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

# Least privilege: the workflow only reads the repository and runs tests, so the
# GITHUB_TOKEN needs no write scopes. This caps the blast radius of a compromised
# action or dependency in the job.
permissions:
  contents: read

# Cancel superseded runs for the same ref so a rapid push/PR update does not keep
# outdated jobs running or land status out of order.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Installs fyrion with the dev toolchain (pytest, black, flake8, mypy) and
        # the web extra (fastapi, uvicorn, etc.) so the FastAPI dashboard tests run
        # instead of being importorskip-skipped.
        pip install -e .[dev,web]
        
    - name: Check code formatting with Black
      run: |
        black --check src tests
        
    - name: Lint with Flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names
        flake8 src tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # Treat all other issues as warnings, enforcing a reasonable line length
        flake8 src tests --count --exit-zero --max-complexity=15 --max-line-length=120 --statistics
        
    - name: Type check with Mypy
      run: |
        mypy src --ignore-missing-imports
        
    - name: Run unit and integration tests
      run: |
        pytest tests/ -v
      env:
        # Explicitly inject dummy environment variables to satisfy config.py validation
        DISCORD_TOKEN: "dummy_ci_token_for_testing_only"
        ENVIRONMENT: "testing"
