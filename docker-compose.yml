# ---------------------------------------------------------------------------
# Fyrion self-hosting stack.
#
#   1. cp .env.example .env
#   2. set DISCORD_TOKEN in .env
#   3. docker compose up -d --build
#   4. docker compose logs -f fyrion
#
# The dashboard is disabled by default. To enable it, set DASHBOARD_ENABLED,
# DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET and DASHBOARD_SECRET_KEY in .env,
# then uncomment the ports block below. Publishing that port exposes an
# authenticated admin API: terminate TLS and run a reverse proxy in front of it.
# ---------------------------------------------------------------------------

services:
  fyrion:
    build:
      context: .
      dockerfile: Dockerfile
    image: fyrion:latest
    container_name: fyrion
    restart: unless-stopped

    # DISCORD_TOKEN and the OAuth credentials come from .env, which is
    # gitignored. Nothing secret is ever written into the image.
    env_file:
      - .env

    environment:
      # Overrides .env so the database always lands on the persistent volume,
      # whatever DATABASE_URL says locally.
      DATABASE_URL: /data/fyrion.db
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-5}
      DATABASE_BUSY_TIMEOUT_MS: ${DATABASE_BUSY_TIMEOUT_MS:-5000}
      DATABASE_MAINTENANCE_INTERVAL_SECONDS: ${DATABASE_MAINTENANCE_INTERVAL_SECONDS:-3600}

      LOG_DIR: /app/logs
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      ENVIRONMENT: ${ENVIRONMENT:-production}

      # Inside a container the server must bind all interfaces for Docker to
      # route to it. Exposure is still controlled by the ports block below.
      DASHBOARD_HOST: ${DASHBOARD_HOST:-0.0.0.0}
      DASHBOARD_PORT: ${DASHBOARD_PORT:-8080}

    volumes:
      - fyrion-data:/data
      - fyrion-logs:/app/logs

    # Publish only when the dashboard is enabled and fronted by a proxy.
    # Binding to 127.0.0.1 keeps it off the public interface.
    # ports:
    #   - "127.0.0.1:8080:8080"

    # Time to drain HTTP requests, close the gateway session cleanly and shut
    # down the SQLite pool. fyrion.runtime handles SIGTERM for exactly this.
    stop_grace_period: 30s

    security_opt:
      - no-new-privileges:true

    # The image writes only to /data and /app/logs, both of which are volumes.
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777

    ulimits:
      nofile:
        soft: 4096
        hard: 8192

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    healthcheck:
      # Confirms the SQLite database is reachable and carries Fyrion's schema.
      # A container that cannot open its own database is not serving anything.
      test:
        - CMD-SHELL
        - >-
          python -c "import sqlite3,sys;
          c=sqlite3.connect('/data/fyrion.db');
          c.execute('SELECT 1 FROM guild_settings LIMIT 1');
          c.close()" || exit 1
      interval: 60s
      timeout: 10s
      start_period: 45s
      retries: 3

volumes:
  fyrion-data:
    name: fyrion-data
  fyrion-logs:
    name: fyrion-logs
