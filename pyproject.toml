[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fyrion"
version = "0.1.0"
description = "Powerful tools for better Discord communities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    "black>=23.7.0",
    "flake8>=6.1.0",
    "mypy>=1.5.0"
]
# Needed only when the web dashboard is served (DASHBOARD_ENABLED=true or
# `python -m dashboard`) and by the fun cog's outbound HTTP commands. These live
# only in requirements.txt otherwise, so `pip install fyrion` cannot run the
# dashboard and CI cannot import/type-check fyrion.web or dashboard/. The exact
# deployment pins stay in requirements.txt; these are compatible floors.
web = [
    "fastapi>=0.115.6",
    "uvicorn>=0.32.1",
    "starlette>=0.41.3",
    "pydantic>=2.10.4",
    "httpx>=0.27.2",
    "aiohttp>=3.10.11",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0"
]
