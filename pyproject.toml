[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fyrion"
version = "0.1.0"
description = "Powerful tools for better Discord communities."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "discord.py>=2.4.0",
    "python-dotenv>=1.0.1",
    "aiosqlite>=0.20.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.1",
    # Pinned exactly: black's formatting rules change between releases, so an
    # unpinned floor lets CI float to a newer black that reformats the tree and
    # fails `black --check`. Bump this deliberately alongside a reformat commit.
    "black==26.5.1",
    "flake8>=6.1.0",
    "mypy>=1.5.0"
]
# Needed only when the web dashboard is served (DASHBOARD_ENABLED=true or
# `python -m dashboard`) and by the fun cog's outbound HTTP commands. These live
# only in requirements.txt otherwise, so `pip install fyrion` cannot run the
# dashboard and CI cannot import/type-check fyrion.web or dashboard/. The exact
# deployment pins stay in requirements.txt; these are compatible floors.
web = [
    "fastapi>=0.115.6",
    "uvicorn>=0.32.1",
    "starlette>=0.41.3",
    "pydantic>=2.10.4",
    "httpx>=0.27.2",
    "aiohttp>=3.10.11",
    "jinja2>=3.1.4",
    "itsdangerous>=2.2.0"
]

[tool.black]
# Pin the target to the supported interpreter range (requires-python >= 3.10) so
# formatting is deterministic across the CI matrix and does not drift with the
# running interpreter. Without this, black auto-targets the newest grammar it
# knows and warns that older Pythons "cannot parse code formatted for 3.15".
target-version = ["py310", "py311", "py312"]

[tool.mypy]
# Shared type-checking settings so a bare local `mypy src dashboard` and CI
# check the same tree under the same rules. The standalone `dashboard/` package
# is included alongside the source package (see the CI mypy step); it was
# previously unchecked even though it is disciplined about typing.
python_version = "3.10"
# Third-party deps are either untyped (discord.py) or only present when the web
# extra is installed (fastapi, uvicorn, starlette, httpx). Skipping their
# missing stubs keeps the check on Fyrion's own annotations, matching the flag
# CI passed before this config existed.
ignore_missing_imports = true
# The package lives under src/ (src-layout), so tell mypy that src is a package
# root. Without this, `mypy src dashboard` walks into src/fyrion/cogs and treats
# each module as a top-level import (e.g. `antinuke`), which then collides with
# the same file discovered via the `fyrion.cogs` package and aborts with
# "Duplicate module named ...". Rooting the search at src makes every module
# resolve as `fyrion.*` exactly once.
mypy_path = "src"
explicit_package_bases = true
namespace_packages = true
